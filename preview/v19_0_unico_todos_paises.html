<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>v19.0 IN7Artes — Preview Público</title>
<style>
:root{--gold:#d9ad45;--cream:#f4ead6;--green:#0f5d43;--ink:#080604;--panel:#14100c;--line:#d9ad4545;--muted:#b8ae9e;--ok:#9beabf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173c2d 0,#080604 42%,#040302 100%);color:var(--cream);font-family:Inter,Segoe UI,Arial,sans-serif}button,select,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#060403,#123222 55%,#060403);border-bottom:3px solid var(--gold);box-shadow:0 20px 70px #000b}.brand{max-width:1500px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logo{font:900 32px Georgia,serif;color:var(--gold)}.logo span{color:#fff;font-size:.75em}.ver{background:var(--gold);color:#080604;border-radius:999px;padding:8px 12px;font-weight:900}.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.nav button,.pill{border:1px solid #ffffff22;background:#18130e;color:#fff;border-radius:999px;padding:9px 12px;text-decoration:none}.nav button.active,.pill.gold{background:var(--gold);color:#080604;font-weight:900}.menus{max-width:1500px;margin:auto;padding:0 18px 14px;border-top:1px solid #d9ad4529}.label{color:var(--ok);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin:10px 0 6px}.ribbon{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.ribbon button{flex:0 0 auto;border:1px solid var(--line);background:#0b0806;color:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.ribbon button.sel{background:var(--gold);color:#080604}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.controls select,.controls input{width:100%;border:1px solid #d9ad4560;background:#0b0806;color:#fff;border-radius:14px;padding:10px}main{max-width:1500px;margin:auto;padding:22px 18px 80px}.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}.card{background:linear-gradient(180deg,#17120d,#100c08);border:1px solid #ffffff18;border-radius:24px;padding:20px;box-shadow:0 18px 60px #0005}.side{position:sticky;top:230px;align-self:start}h1,h2,h3{font-family:Georgia,serif;color:var(--gold);margin:0 0 12px}h1{font-size:42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #ffffff18;background:#ffffff0a;border-radius:16px;padding:13px;margin-bottom:8px;color:#fff}.item strong{color:#f6d891}.item:hover{border-color:var(--gold);background:#d9ad4514}.muted,p{color:var(--muted);line-height:1.5}.badge{display:inline-block;background:#0f5d4333;color:var(--ok);border-radius:999px;padding:5px 10px;margin:3px;font-size:12px}.btn{border:1px solid #ffffff22;background:#15100c;color:#fff;border-radius:999px;padding:10px 14px;margin:4px}.btn.gold{background:var(--gold);color:#080604;font-weight:900}.empty{border:1px solid #d9ad4540;background:#d9ad4510;border-radius:18px;padding:16px;color:#f5d891}textarea{width:100%;min-height:145px;background:#0b0806;color:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{margin-top:18px}.route{font-family:monospace;color:#9beabf;font-size:12px;word-break:break-word}@media(max-width:980px){.layout,.grid,.controls,.editor{grid-template-columns:1fr}.side{position:static}.nav{margin-left:0}h1{font-size:32px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo" onclick="setPage('home')">IN<span>7</span>Artes</div><div class="ver">v19.0 público</div><div class="nav" id="nav"></div></div><div class="menus"><div class="label">🌍 Países / Territórios</div><div class="ribbon" id="countries"></div><div class="label">🎨 Artes / Áreas</div><div class="ribbon" id="areas"></div><div class="controls"><select id="subarea"></select><select id="user"></select><input id="search" placeholder="Pesquisar no portal" oninput="render()"></div></div></header>
<main><div class="layout"><aside class="card side" id="side"></aside><section id="app"></section></div></main>
<script>
const countries=['Portugal','Brasil','Angola','Moçambique','Cabo Verde','Guiné-Bissau','São Tomé e Príncipe','Timor-Leste','Macau','Goa/Damão/Diu','Galiza','Guiné Equatorial'];
const flags={'Portugal':'🇵🇹','Brasil':'🇧🇷','Angola':'🇦🇴','Moçambique':'🇲🇿','Cabo Verde':'🇨🇻','Guiné-Bissau':'🇬🇼','São Tomé e Príncipe':'🇸🇹','Timor-Leste':'🇹🇱','Macau':'🇲🇴','Goa/Damão/Diu':'🇮🇳','Galiza':'🇪🇸','Guiné Equatorial':'🇬🇶'};
const areas=['Pintura','Escultura','Literatura','Música','Cinema','Fotografia','Arquitectura & Design','História','Património','Gastronomia','Turismo & Natureza','Comunidades','Personalidades','Testa os teus Conhecimentos'];
const subareas=['Artistas - Top Actual','Artistas - Melhores de Sempre','Obras - Obras Actuais','Obras - Melhores Obras de Sempre','Mercado','Museus','Fóruns','Eventos, Exposições, Galerias e Museus','Coleccionismo relacionado','Autores','Obras','Coleccionismo','Tipos e Correntes Artísticas','Vídeo Galeria','Galeria de Imagem','Galeria de Redes Sociais','Fontes e Validação'];
const users=[
{name:'Paulo Parreira',email:'inlisboa@gmail.com',role:'Super administrador'},
{name:'João Braizinha',email:'braizinha543@gmail.com',role:'Gestor de conteúdos'},
{name:'David Ribeiro',email:'DAVID1997.RIBEIRO@gmail.com',role:'Gestor de conteúdos'},
{name:'Clénia Gomes',email:'cleniagomes827@gmail.com',role:'Gestora de conteúdos'},
{name:'João Nabais',email:'JOAOPAULONABAIS@gmail.com',role:'Gestor de conteúdos'},
{name:'Utilizador Demo',email:'demo@in7artes.com',role:'Utilizador geral'}];
const seed={
'Portugal':{Pintura:['Vhils','Joana Vasconcelos','Júlio Pomar','Paula Rego','Vieira da Silva','Amadeo de Souza-Cardoso','Nadir Afonso','José de Guimarães','Graça Morais','Almada Negreiros'],Literatura:['Luís de Camões','Fernando Pessoa','Eça de Queirós','José Saramago','Sophia de Mello Breyner','Lídia Jorge','Gonçalo M. Tavares','Valter Hugo Mãe'],Música:['Amália Rodrigues','Mariza','Carlos do Carmo','José Afonso','Sérgio Godinho','Dulce Pontes','António Variações','Ana Moura']},
'Brasil':{Pintura:['Tarsila do Amaral','Candido Portinari','Anita Malfatti','Beatriz Milhazes','Vik Muniz','Lygia Clark','Hélio Oiticica','Adriana Varejão'],Literatura:['Machado de Assis','Clarice Lispector','Jorge Amado','Guimarães Rosa','Carlos Drummond de Andrade'],Música:['Caetano Veloso','Gilberto Gil','Chico Buarque','Tom Jobim','Elis Regina','Marisa Monte']},
'Angola':{Pintura:['António Ole','Yonamine','Kiluanji Kia Henda','Etona','Van','Fineza Teta','Francisco Van-Dúnem'],Literatura:['Pepetela','José Eduardo Agualusa','Ondjaki','Ana Paula Tavares','Luandino Vieira'],Música:['Bonga','C4 Pedro','Anselmo Ralph','Pérola','Matias Damásio','Yuri da Cunha'], 'Arquitectura & Design':['COSTALOPES','Memorial Agostinho Neto','Assembleia Nacional de Angola','TEKSTUDIO','Arquitectura contemporânea de Luanda']},
'Moçambique':{Pintura:['Malangatana','Bertina Lopes','Naguib','Gonçalo Mabunda','Gemuce'],Literatura:['Mia Couto','José Craveirinha','Paulina Chiziane','Ungulani Ba Ka Khosa'],Música:['Marrabenta','Wazimbo','Neyma','Ghorwane','Stewart Sukuma']},
'Cabo Verde':{Pintura:['Kiki Lima','Tchalé Figueira','Mito Elias','Manuel Figueira','Leão Lopes'],Literatura:['Baltasar Lopes','Germano Almeida','Jorge Barbosa','Corsino Fortes','Manuel Lopes'],Música:['Cesária Évora','Bana','Ildo Lobo','Mayra Andrade','Lura','Elida Almeida'],Património:['Cidade Velha','Fortaleza Real de São Filipe','Centro Histórico do Mindelo'],Gastronomia:['Cachupa','Grogue','Pastel com diabo dentro','Xerém','Búzio']},
'Guiné-Bissau':{Pintura:['Nú Barreto','Pequeno Águas','Augusto Trigo','Arte bijagó contemporânea'],Literatura:['Abdulai Silá','Tony Tcheka','Odete Semedo','Carlos Lopes'],Música:['José Carlos Schwarz','Super Mama Djombo','Karyna Gomes','Manecas Costa'],Cinema:['Flora Gomes','Sana na N’Hada'],Património:['Fortaleza d’Amura','Arquipélago dos Bijagós','Património balanta e fula']},
'São Tomé e Príncipe':{Pintura:['António Agostinho Neto?','Arte contemporânea santomense','Pintura da ilha de São Tomé'],Literatura:['Alda Espírito Santo','Conceição Lima','Francisco José Tenreiro'],Música:['Juka','Africa Negra','Camilo Domingos'],Património:['Roças históricas','Obô de São Tomé','Centro histórico de São Tomé']},
'Timor-Leste':{Pintura:['Arte contemporânea timorense','Tais e artes visuais','Colectivos artísticos de Díli'],Literatura:['Luís Cardoso','Xanana Gusmão','Fernando Sylvan'],Música:['Ego Lemos','Lahane','Música tradicional timorense'],Património:['Tais','Cristo Rei de Díli','Arquitectura colonial de Díli']},
'Macau':{Pintura:['George Chinnery','Konstantin Bessmertny','Ung Vai Meng','Carlos Marreiros'],Literatura:['Henrique de Senna Fernandes','Deolinda da Conceição','Yao Jingming'],Música:['Orquestra de Macau','Música macaense'],Património:['Centro Histórico de Macau','Ruínas de São Paulo','Templo de A-Má']},
'Goa/Damão/Diu':{Pintura:['Angelo da Fonseca','Francis Newton Souza','Laxman Pai'],Literatura:['Orlando da Costa','Vimala Devi','Eunice de Souza'],Música:['Mando goês','Fado de Goa','Música indo-portuguesa'],Património:['Igrejas e Conventos de Goa','Fontainhas','Fortaleza de Diu']},
'Galiza':{Pintura:['Castelao','Laxeiro','Maruja Mallo','Luis Seoane'],Literatura:['Rosalía de Castro','Castelao','Manuel Rivas','Álvaro Cunqueiro'],Música:['Carlos Núñez','Luar na Lubre','Milladoiro'],Património:['Catedral de Santiago','Torre de Hércules','Caminho de Santiago']},
'Guiné Equatorial':{Pintura:['Arte contemporânea equato-guineense','Colectivos de Malabo','Artes visuais de Bioko'],Literatura:['Donato Ndongo','Juan Tomás Ávila Laurel','María Nsué'],Música:['Música fang','Hijas del Sol','Música bubi'],Património:['Malabo colonial','Ilha de Bioko','Monte Alén']}
};
const baseByArea={Escultura:['Escultura pública','Arte em madeira','Instalação contemporânea','Objectos rituais','Arte urbana'],Cinema:['Cinema nacional','Documentário','Curtas-metragens','Realizadores emergentes','Arquivo audiovisual'],Fotografia:['Fotografia documental','Arquivo histórico','Retrato contemporâneo','Paisagem urbana','Fotografia de património'],'Arquitectura & Design':['Centro histórico','Arquitectura colonial','Design contemporâneo','Arquitectura vernacular','Edifícios públicos'],História:['Origens e formação','Período colonial','Independência','Diáspora','História contemporânea'],Património:['Património UNESCO','Fortalezas e centros históricos','Museus e arquivos','Património imaterial','Arquitectura tradicional'],Gastronomia:['Prato nacional','Cozinha de festa','Doçaria','Bebidas tradicionais','Mercado alimentar'],'Turismo & Natureza':['Parques naturais','Praias e ilhas','Montanhas e paisagens','Rotas culturais','Turismo comunitário'],Comunidades:['Portugal','França','Estados Unidos','Brasil','Diáspora lusófona'],Personalidades:['Líderes culturais','Artistas','Escritores','Músicos','Personalidades históricas'],'Testa os teus Conhecimentos':['Quiz História','Quiz Música','Quiz Gastronomia','Quiz Bandeiras','Quiz Património']};
let state={page:'home',country:'Cabo Verde',area:'Pintura',subarea:'Artistas - Top Actual'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dataList(country,area,subarea){const c=seed[country]||{};let arr=c[area]||baseByArea[area]||c.Pintura||['Conteúdo em validação editorial'];if(subarea.includes('Obras')) return arr.map(x=>'Obra / referência — '+x);if(subarea==='Mercado') return ['Marketplace IN7Artes','Obras originais','Edições limitadas','Catálogos','Leilões','Galerias parceiras'];if(subarea==='Museus') return ['Museu nacional / arquivo','Centro cultural','Galeria pública','Instituição patrimonial'];if(subarea==='Fóruns') return ['Debate geral','Novos talentos','Coleccionismo','Eventos','Fontes e validação'];if(subarea.includes('Redes')) return ['Instagram','Facebook','YouTube','TikTok','LinkedIn','Threads'];if(subarea.includes('Eventos')) return ['Exposições','Bienais','Feiras culturais','Conferências','Galerias'];if(subarea.includes('Vídeo')) return ['Entrevistas','Documentários','Concertos','Visitas guiadas'];if(subarea.includes('Fontes')) return ['Wikipédia/Wikidata','CPLP','Instituições culturais locais','Arquivos e museus','Fontes próprias IN7Artes'];return arr}
function setPage(p){state.page=p;render()}function setCountry(c){state.country=c;render()}function setArea(a){state.area=a;render()}function setSub(s){state.subarea=s;render()}
function top(){nav.innerHTML=['home','conteudos','backoffice','editor','deploy'].map(p=>`<button class="${state.page===p?'active':''}" onclick="setPage('${p}')">${p==='home'?'Início':p==='conteudos'?'Conteúdos':p==='backoffice'?'Backoffice':p==='editor'?'Editor':'Online'}</button>`).join('');countriesEl.innerHTML=countries.map(c=>`<button class="${state.country===c?'sel':''}" onclick="setCountry('${esc(c)}')">${flags[c]||''} ${esc(c)}</button>`).join('');areasEl.innerHTML=areas.map(a=>`<button class="${state.area===a?'sel':''}" onclick="setArea('${esc(a)}')">${esc(a)}</button>`).join('');subarea.innerHTML=subareas.map(s=>`<option ${state.subarea===s?'selected':''}>${esc(s)}</option>`).join('');user.innerHTML=users.map(u=>`<option>${esc(u.name)} · ${esc(u.role)}</option>`).join('')}
function sidePanel(){const list=dataList(state.country,state.area,state.subarea);side.innerHTML=`<h2>${flags[state.country]||''} ${esc(state.country)}</h2><p>${esc(state.area)} · ${esc(state.subarea)}</p><span class="badge">${list.length} itens</span><span class="badge">editável</span><span class="badge">v19.0</span><hr style="border-color:#ffffff18"><button class="btn gold" onclick="setPage('editor')">Editar conteúdo</button><button class="btn" onclick="setPage('backoffice')">Gestores</button><button class="btn" onclick="downloadJSON()">Exportar JSON</button><p class="route">/pais/${slug(state.country)}/area/${slug(state.area)}/sub/${slug(state.subarea)}</p>`}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function renderHome(){app.innerHTML=`<section class="card"><h1>IN7Artes · + do que 7 Artes</h1><p>Versão única, leve, editável e preparada para testes online. Integra países, áreas, conteúdos editoriais, utilizadores e gestores de conteúdos.</p><div class="grid">${countries.map(c=>`<button class="item" onclick="setCountry('${esc(c)}');setPage('conteudos')"><strong>${flags[c]||''} ${esc(c)}</strong><p>14 áreas culturais e editoriais.</p></button>`).join('')}</div></section>`}
function renderConteudos(){let q=(search.value||'').toLowerCase();let list=dataList(state.country,state.area,state.subarea).filter(x=>x.toLowerCase().includes(q));app.innerHTML=`<section class="card"><h1>${flags[state.country]||''} ${esc(state.area)} — ${esc(state.country)}</h1><p>${esc(state.subarea)}</p><div class="grid">${list.map((x,i)=>`<div class="item"><strong>${i+1}. ${esc(x)}</strong><p>Ficha editorial: ${esc(state.country)} · ${esc(state.area)} · ${esc(state.subarea)}. Conteúdo preparado para validação por gestor.</p><button class="btn" onclick="openFicha('${esc(x)}')">Abrir ficha</button></div>`).join('')||'<div class="empty">Sem resultados para esta pesquisa.</div>'}</div></section>`}
function openFicha(x){app.innerHTML=`<section class="card"><button class="btn" onclick="setPage('conteudos')">← Voltar</button><h1>${esc(x)}</h1><p>${esc(state.country)} · ${esc(state.area)} · ${esc(state.subarea)}</p><div class="grid"><div class="item"><strong>Resumo</strong><p>Ficha pública preparada para bio, obras, imagens, vídeos, fontes, mercado e redes sociais.</p></div><div class="item"><strong>Mercado</strong><p>Obras, edições, catálogos, leilões, galerias parceiras e alertas.</p></div><div class="item"><strong>Validação</strong><p>Estado: rascunho editorial. A validar por gestor de conteúdo ou super administrador.</p></div></div><button class="btn gold" onclick="navigator.clipboard.writeText('${esc(x)}')">Copiar ficha</button></section>`}
function renderBackoffice(){app.innerHTML=`<section class="card"><h1>Backoffice · Utilizadores e Gestores</h1><p>Perfis preparados para testes online e moderação editorial por país/área.</p><div class="grid">${users.map(u=>`<div class="item"><strong>${esc(u.name)}</strong><p>${esc(u.email)}</p><span class="badge">${esc(u.role)}</span><p>Permissões: criar, editar, propor, validar ou publicar conforme perfil.</p></div>`).join('')}</div></section>`}
function renderEditor(){let current=dataList(state.country,state.area,state.subarea).join('\n');app.innerHTML=`<section class="card"><h1>Editor local</h1><p>Edita rapidamente a lista selecionada. Esta demo guarda no navegador com localStorage.</p><div class="editor"><div><h3>Conteúdo</h3><textarea id="editBox">${esc(current)}</textarea><button class="btn gold" onclick="saveLocal()">Guardar localmente</button></div><div><h3>Instruções</h3><p>Para colocar online, exportar JSON e integrar no repositório GitHub/Netlify. Perfis de gestor ficam no backoffice.</p><p class="route">${esc(state.country)} / ${esc(state.area)} / ${esc(state.subarea)}</p></div></div></section>`}
function renderDeploy(){app.innerHTML=`<section class="card"><h1>Preparação online</h1><p>Versão pública de teste pronta para GitHub Pages/Netlify.</p><div class="grid"><div class="item"><strong>Ficheiro</strong><p>preview/v19_0_unico_todos_paises.html</p></div><div class="item"><strong>URL esperado</strong><p class="route">https://inlisboa-coder.github.io/in7artes/preview/v19_0_unico_todos_paises.html</p></div><div class="item"><strong>Gestão</strong><p>Backoffice demo com gestores de conteúdos e perfis Meu Mundo +.</p></div></div></section>`}
function saveLocal(){localStorage.setItem('in7artes-edit-'+slug(state.country+'-'+state.area+'-'+state.subarea),editBox.value);alert('Guardado localmente neste navegador.')}function downloadJSON(){const blob=new Blob([JSON.stringify({version:'v19.0',state,users,seed},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='in7artes_v19_export.json';a.click()}
function render(){top();sidePanel();if(state.page==='home')renderHome();if(state.page==='conteudos')renderConteudos();if(state.page==='backoffice')renderBackoffice();if(state.page==='editor')renderEditor();if(state.page==='deploy')renderDeploy()}const nav=document.getElementById('nav'),countriesEl=document.getElementById('countries'),areasEl=document.getElementById('areas'),app=document.getElementById('app'),side=document.getElementById('side');subarea.onchange=e=>setSub(e.target.value);render();
</script>
</body>
</html>
