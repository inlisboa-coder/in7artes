<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IN7Artes v16.5 FIX</title><style>body{margin:0;font-family:Arial;background:#f5eddd;color:#111}header{position:sticky;top:0;background:#0d3b2e;color:white;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:4px solid #c49a3a}b{font-size:28px;color:#c49a3a}select,input{padding:9px;border-radius:10px;border:1px solid #c49a3a}input{min-width:260px;flex:1}.hero{background:linear-gradient(135deg,#0d3b2e,#1b5a47);color:white;padding:32px}.hero h1{font-size:38px;margin:0 0 10px}#stats span{display:inline-block;background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;margin:4px}nav{background:#123f32;padding:10px;display:flex;gap:8px;overflow:auto;position:sticky;top:66px}button{white-space:nowrap;border:1px solid #c49a3a;border-radius:999px;padding:8px 12px;background:#fff8e6;font-weight:bold}button.active{background:#c49a3a}main{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card{background:white;border-radius:16px;border-top:5px solid #c49a3a;padding:18px;box-shadow:0 4px 14px #0002}.meta{font-size:13px;color:#755500}h2{color:#0d3b2e;margin-top:0}li{margin:5px 0}footer{text-align:center;background:#0d3b2e;color:#ead49a;padding:24px}</style></head><body><header><b>IN7Artes</b><span>v16.5 corrigida · Todos os países · Todas as áreas</span><select id="country"></select><select id="area"></select><input id="search" placeholder="Pesquisar por nome, país, arte, obra..."></header><section class="hero"><h1 id="title"></h1><p id="rule"></p><div id="stats"></div></section><nav id="tabs"></nav><main id="content"></main><footer>@ 2026 IN7Artes · v16.5 fix</footer><script>const AREAS=['Pintura','Escultura','Literatura','Música','Cinema','Fotografia','Arquitectura & Design','História','Património','Gastronomia','Turismo & Natureza','Comunidades','Personalidades','Testa os teus Conhecimentos'];const SECTIONS=['Artistas - Top Actual','Artistas - Melhores de Sempre','Obras - Obras Actuais','Obras - Melhores Obras de Sempre','Fóruns','Mercado','Museus','Redes Sociais','Eventos, Exposições, Galerias e Museus','+ Info da Arte e Artistas','Modo Colaborativo - 7 Níveis'];const SEEDS={portugal:['Vhils','Joana Vasconcelos','Júlio Pomar','Paula Rego','Amadeo','Almada','Graça Morais','Lisboa','Porto','Sintra','Fado','Camões','Pessoa','Saramago','Azulejo','Bacalhau','Douro','Gulbenkian','Serralves','Comunidades'],angola:['Luanda','António Ole','Yonamine','Januário Jano','Kiluanji Kia Henda','Bonga','Paulo Flores','C4 Pedro','Anselmo Ralph','Pepetela','Agostinho Neto','Mbanza Kongo','Kalandula','Tundavala','Semba','Kizomba','Funge','Rainha Njinga','Benguela','Comunidade angolana'],brasil:['Tarsila do Amaral','Portinari','Beatriz Milhazes','Vik Muniz','Adriana Varejão','Machado de Assis','Clarice Lispector','Tom Jobim','Caetano Veloso','Gilberto Gil','Oscar Niemeyer','Lina Bo Bardi','Rio de Janeiro','São Paulo','Amazónia','Brasília','Samba','Bossa Nova','Feijoada','Comunidade brasileira'],mocambique:['Maputo','Ilha de Moçambique','Mia Couto','Malangatana','Gorongosa','Bazaruto','Marrabenta','Timbila','Paulina Chiziane','Noémia de Sousa'],cabo_verde:['Mindelo','Praia','Cesária Évora','Morna','Sodade','Batuque','Funaná','Santiago','São Vicente','Germano Almeida'],guine_bissau:['Bissau','Bijagós','Amílcar Cabral','Gumbé','Cacheu','Bolama','Odete Semedo','Tabanka','Carnaval','Crioulo'],sao_tome:['São Tomé','Príncipe','Roças','Tchiloli','Conceição Lima','Alda Espírito Santo','Cacau','Café','Obô','Ilhéu das Rolas'],timor_leste:['Díli','Baucau','Tais','Lulik','Xanana Gusmão','José Ramos-Horta','Tétum','Atauro','Ramelaú','Resistência'],macau:['Centro Histórico de Macau','Ruínas de São Paulo','A-Má','Largo do Senado','Macaense','Minchi','Patuá','Taipa','Coloane','Museu de Macau'],goa:['Goa','Velha Goa','Panjim','Damão','Diu','Basílica do Bom Jesus','Konkani','Vindaloo','Bebinca','Mando'],galiza:['Santiago de Compostela','Rosalía de Castro','Castelao','Camiño de Santiago','Língua galega','Rias Baixas','Fisterra','Sargadelos','Vigo','A Corunha'],guine_equatorial:['Malabo','Bata','Bioko','Annobón','Monte Alén','Cultura fang','Cultura bubi','CPLP','Río Muni','Língua portuguesa']};const META={portugal:['🇵🇹','Portugal',50],angola:['🇦🇴','Angola',20],brasil:['🇧🇷','Brasil',50],mocambique:['🇲🇿','Moçambique',20],cabo_verde:['🇨🇻','Cabo Verde',20],guine_bissau:['🇬🇼','Guiné-Bissau',20],sao_tome:['🇸🇹','São Tomé e Príncipe',20],timor_leste:['🇹🇱','Timor-Leste',20],macau:['🇲🇴','Macau',20],goa:['🇮🇳','Goa, Damão e Diu',20],galiza:['🇪🇸','Galiza',20],guine_equatorial:['🇬🇶','Guiné Equatorial',20]};function fill(seed,t,a,s,c){let o=[];for(let i=0;i<t;i++)o.push(`${seed[i%seed.length]} — ${s} — ${a} — ${c}`);return o}const D={rule:'Portugal e Brasil: 50 por subárea. Restantes países: 20. Todas as áreas têm modo colaborativo de 7 níveis.',countries:{}};for(const k in SEEDS){const [flag,name,t]=META[k];const areas={};AREAS.forEach(a=>{const obj={};SECTIONS.forEach(s=>obj[s]=fill(SEEDS[k],t,a,s,name));areas[a]=obj});D.countries[k]={flag,name,target:t,areas}};let tab='Artistas - Top Actual';const country=document.getElementById('country'),area=document.getElementById('area'),search=document.getElementById('search'),title=document.getElementById('title'),rule=document.getElementById('rule'),stats=document.getElementById('stats'),tabs=document.getElementById('tabs'),content=document.getElementById('content');function entries(){return Object.entries(D.countries)}function allAreas(){return [...new Set(entries().flatMap(([k,c])=>Object.keys(c.areas)))]}function fillAreas(){let arr=country.value==='__all__'?allAreas():Object.keys(D.countries[country.value].areas);area.innerHTML='<option value="__all__">🎭 Todas as áreas</option>'+arr.map(x=>`<option>${x}</option>`).join('')}function init(){country.innerHTML='<option value="__all__">🌍 Todos os países</option>'+entries().map(([k,c])=>`<option value="${k}">${c.flag} ${c.name}</option>`).join('');fillAreas();render()}country.onchange=()=>{fillAreas();render()};area.onchange=render;search.oninput=render;function rows(){const q=search.value.toLowerCase();const cs=country.value==='__all__'?entries():[[country.value,D.countries[country.value]]];let r=[];cs.forEach(([ck,c])=>{const as=area.value==='__all__'?Object.keys(c.areas):[area.value];as.forEach(a=>{const ss=c.areas[a]||{};Object.entries(ss).forEach(([sec,items])=>items.forEach(item=>{const txt=[item,c.name,a,sec].join(' ').toLowerCase();if(!q||txt.includes(q))r.push({c,a,sec,item})}))})});return tab==='__all__'?r:r.filter(x=>x.sec===tab)}function render(){const rs=rows();const cl=country.value==='__all__'?'🌍 Todos os países':D.countries[country.value].flag+' '+D.countries[country.value].name;title.textContent=cl+' — '+(area.value==='__all__'?'Todas as áreas':area.value);rule.textContent=D.rule;stats.innerHTML=`<span>${new Set(rs.map(x=>x.c.name)).size} países</span><span>${new Set(rs.map(x=>x.a)).size} áreas</span><span>${rs.length} resultados</span>`;tabs.innerHTML='<button onclick="tab=\'__all__\';render()">Todas as subáreas</button>'+SECTIONS.map(s=>`<button class="${s===tab?'active':''}" onclick="tab=${JSON.stringify(s)};render()">${s}</button>`).join('');const g={};rs.forEach(x=>{const key=x.c.name+'||'+x.a+'||'+x.sec;(g[key]??=[]).push(x)});content.innerHTML=Object.entries(g).map(([k,v])=>{const [cn,a,s]=k.split('||');return `<article class="card"><div class="meta">${v[0].c.flag} ${cn} · ${a}</div><h2>${s}</h2><ol>${v.slice(0,80).map(x=>`<li>${x.item}</li>`).join('')}</ol></article>`}).join('')||'<article class="card"><h2>Sem resultados</h2></article>'}init();</script></body></html>
