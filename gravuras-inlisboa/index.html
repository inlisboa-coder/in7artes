<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Arte Portuguesa e Lisboa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: galeria em papel — colecções como capas 4:5, obra = imagem + ficha + escolha de formato */
:root{
  --papel:#efe9df; --cartao:#f8f4ec; --tinta:#221e1b; --suave:#6b6259; --ocre:#96602e; --linha:#d8cfc0;
  --f-tit:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-txt:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--papel:#1b1815;--cartao:#24201c;--tinta:#ece5da;--suave:#a89d90;--ocre:#d39a5c;--linha:#3a332c;color-scheme:dark}}
:root[data-theme="dark"]{--papel:#1b1815;--cartao:#24201c;--tinta:#ece5da;--suave:#a89d90;--ocre:#d39a5c;--linha:#3a332c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
a{color:inherit}
:focus-visible{outline:2px solid var(--ocre);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;overflow-x:clip}
header>*,nav,nav>*{min-width:0;max-width:100%}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px;border-bottom:1px solid var(--linha)}
.marca{font-family:var(--f-tit);font-size:28px;font-weight:600;text-decoration:none;letter-spacing:.01em}
.marca span{color:var(--ocre);font-style:italic;font-weight:400}
nav{display:flex;align-items:center;gap:10px 18px;font-size:13.5px;min-width:0}
nav a{text-decoration:none;color:var(--suave);white-space:nowrap}
nav a:hover,nav a[aria-current]{color:var(--tinta)}
nav a[aria-current]{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--ocre)}
nav .top{display:flex;gap:6px 16px;flex-wrap:wrap}
nav .mais{position:relative}
nav .mais>button{font:inherit;color:var(--tinta);background:none;border:1px solid var(--linha);padding:5px 10px;cursor:pointer;white-space:nowrap}
nav .painel{display:none;position:absolute;right:0;top:100%;z-index:20;width:min(560px,90vw);max-height:75vh;overflow:auto;columns:2;column-gap:0;background:var(--cartao);border:1px solid var(--linha);box-shadow:0 10px 30px rgba(0,0,0,.14);padding:8px 0;margin-top:6px}
nav .painel::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
nav .painel a{display:flex;justify-content:space-between;gap:16px;padding:7px 16px;break-inside:avoid}
nav .painel a:hover{background:var(--papel)}
nav .painel small{color:var(--suave);font-variant-numeric:tabular-nums}
nav .mais.aberto .painel{display:block}
@media (hover:hover) and (min-width:821px){nav .mais:hover .painel,nav .mais:focus-within .painel{display:block}}
@media (max-width:820px){
  header{flex-direction:column;align-items:stretch;gap:12px}
  nav{flex-direction:column;align-items:stretch;gap:10px;width:100%}
  nav .top{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  nav .top::-webkit-scrollbar{display:none}
  nav .top a{border:1px solid var(--linha);padding:6px 11px;border-radius:999px;background:var(--cartao)}
  nav .top a[aria-current]{background:var(--tinta);color:var(--papel);text-decoration:none}
  nav .mais>button{width:100%;text-align:left;display:flex;justify-content:space-between;padding:9px 12px}
  nav .painel{position:static;min-width:0;max-height:none;box-shadow:none;margin-top:6px;columns:1}
  nav .painel a{break-inside:avoid;padding:9px 12px}
}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre);font-weight:600}
h1,h2,h3{font-family:var(--f-tit);font-weight:600;margin:0;text-wrap:balance;line-height:1.05}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:40px 28px}
.intro h1{font-size:clamp(40px,6vw,72px)}
.intro p{margin:0;color:var(--suave);max-width:46ch}
.colecoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.col{text-decoration:none;display:flex;flex-direction:column;gap:8px}
.col img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--cartao);box-shadow:0 1px 0 var(--linha)}
.col:hover img{outline:1px solid var(--ocre)}
.col b{font-family:var(--f-tit);font-size:22px;font-weight:600}
.col small{color:var(--suave);font-size:13px}
.formatos{margin-top:44px;border-top:1px solid var(--linha);padding-top:22px}
.formatos ul{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 24px;font-size:14px}
.formatos li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--linha);padding-block:4px}
.formatos li span{color:var(--suave)}
.cab{padding-block:34px 22px;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.cab h1{font-size:clamp(36px,5vw,60px)}
.cab p{margin:6px 0 0;color:var(--suave)}
.grelha{columns:3 260px;column-gap:22px}
.obra{break-inside:avoid;margin:0 0 26px;display:block;text-decoration:none}
.obra img{width:100%;height:auto;display:block;background:var(--cartao)}
.spr{display:block;width:100%;background-repeat:no-repeat;background-color:var(--cartao)}
.obra:hover .spr,.obra:hover img{outline:1px solid var(--ocre)}
.obra figcaption{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13.5px}
.obra figcaption b{font-family:var(--f-tit);font-size:19px;font-weight:600}
.obra figcaption span{color:var(--suave);text-align:right}
.vazio{border:1px solid var(--linha);padding:40px 24px;text-align:center;color:var(--suave);font-family:var(--f-tit);font-style:italic;font-size:22px}
.ficha{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;padding-block:30px}
.ficha .quadro{background:var(--cartao);padding:clamp(14px,3vw,36px);display:flex;justify-content:center}
.ficha .quadro img{max-width:100%;max-height:78vh;height:auto;width:auto;box-shadow:0 2px 14px rgba(0,0,0,.12);display:block}
.ampliar{position:relative;border:0;padding:0;background:none;cursor:zoom-in;max-width:100%}
.ampliar span{position:absolute;right:8px;bottom:8px;font:500 12px "Work Sans",sans-serif;background:rgba(20,18,16,.72);color:#fff;padding:4px 8px;border-radius:3px;pointer-events:none}
.lupa{position:fixed;inset:0;z-index:50;background:rgba(14,12,10,.94);overflow:auto;cursor:zoom-out;display:grid;place-items:center}
.lupa img{display:block;max-width:none;margin:24px}
.lupa .fechar{position:fixed;top:12px;right:12px;z-index:51;font:500 14px "Work Sans",sans-serif;background:#fff;color:#221e1b;border:0;padding:8px 12px;cursor:pointer}
.ficha h1{font-size:clamp(32px,4vw,48px);margin-top:6px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:18px 0;font-size:14px}
dt{color:var(--suave)} dd{margin:0}
.nota{border-left:2px solid var(--ocre);padding:6px 12px;font-size:13.5px;color:var(--suave);margin:0 0 18px}
fieldset{border:0;padding:0;margin:0}
fieldset+fieldset{margin-top:18px}
legend{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre);font-weight:600;margin-bottom:8px}
.opc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--linha);margin-top:-1px;cursor:pointer;font-size:14px}
.opc:has(input:checked){border-color:var(--ocre);background:var(--cartao);position:relative}
.opc span{color:var(--suave);font-size:13px}
.opc em{font-style:normal;font-variant-numeric:tabular-nums}
.pedidos{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn-ped{font:inherit;font-size:14px;padding:10px 16px;border:1px solid var(--ocre);background:var(--ocre);color:#fff;cursor:pointer}
.btn-ped.sec{background:transparent;color:var(--ocre)}
.form-ped{display:grid;gap:10px;padding:16px;border:1px solid var(--linha);background:var(--cartao);margin-top:8px}
.form-ped label{display:grid;gap:4px;font-size:13px;color:var(--suave)}
.form-ped input,.form-ped textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--linha);background:var(--papel,#fff);color:inherit;width:100%;box-sizing:border-box}
.ped-ref{white-space:pre-line;font-size:13px;margin:0}
.ped-msg{font-size:13px;margin:0;color:var(--suave)}
.grupo{font-size:12.5px;color:var(--suave);margin:14px 0 6px}
.escolha{margin-top:16px;padding:14px;background:var(--cartao);border:1px solid var(--linha);font-size:14px}
.escolha code{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--ocre)}
.escala{display:flex;align-items:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
.escala div{border:1px solid var(--suave);font-size:10.5px;color:var(--suave);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.escala div.on{border-color:var(--ocre);background:color-mix(in srgb,var(--ocre) 15%,transparent);color:var(--tinta)}
.baixar{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.baixar[hidden]{display:none}
.baixar button{font:500 14px "Work Sans",sans-serif;padding:10px 16px;background:var(--tinta);color:var(--papel);border:0;cursor:pointer}
.baixar button:hover{background:var(--ocre)} .baixar button:disabled{opacity:.6;cursor:wait}
.baixar small{font-size:12.5px;color:var(--suave)}
.nav-obra{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:14px}
.nav-obra a{text-decoration:none;color:var(--suave)} .nav-obra a:hover{color:var(--tinta)}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--suave)}
@media (max-width:820px){.intro,.ficha{grid-template-columns:minmax(0,1fr)}}
</style>

  const val = n => (document.querySelector(`input[name="${n}"]:checked`)||{}).value;
  const opcoes = () => {
    const s = SUP.find(x=>x.k===val("sup")), ac = val("acab"), tm = val("tam");
    document.getElementById("f-acab").hidden = !s.acab.length; document.getElementById("f-tam").hidden = s.k==="ORIG";
    document.getElementById("acab").innerHTML = s.acab.map(([k,n],i)=>`<label class="opc"><input type="radio" name="acab" value="${k}" ${(ac&&s.acab.some(x=>x[0]===ac)?ac===k:i===0)?"checked":""}><b style="font-weight:500">${n}</b><span></span></label>`).join("");
    const ok = k => s.k!=="D" || cabe(o.id,k);
    const tdef = s.tam.includes(tm)&&ok(tm)?tm:(s.tam.find(ok)||"");
    document.getElementById("tam").innerHTML = s.tam.map(k=>{const p=PROD.find(x=>x.k===`${s.k}-SM-${k}`)||PROD.find(x=>x.k.endsWith("-"+k));return `<label class="opc"${ok(k)?"":" style=\"opacity:.45\""}><input type="radio" name="tam" value="${k}" ${k===tdef?"checked":""} ${ok(k)?"":"disabled"}><b style="font-weight:500">${TAM[k]}</b><span>${ok(k)?(p.fmt.includes(" · ")?p.fmt.split(" · ")[1]:p.fmt):"resolução insuficiente"}</span></label>`}).join("");
  };
  const desenhar = () => {
    const s = val("sup"), k = s==="ORIG" ? "ORIG" : s==="D" ? `D-${val("tam")}` : `${s}-${val("acab")}-${val("tam")}`, p = PROD.find(x=>x.k===k);
    if(s==="D" && !val("tam")){ esc.innerHTML = `<b>Ficheiro digital</b><br>A resolução desta imagem não permite download em A4 ou superior.`; return; }
    if(!p){ esc.innerHTML=""; return; }
    const escala = s==="ORIG" ? [] : SUP.find(x=>x.k===s).tam.map(t=>[t,ESC[t]]);
    esc.innerHTML = `<b>${p.tipo}${s!=="ORIG"?" · "+p.fmt:""}</b><br>Referência <code>IL-${o.id}-${k}</code> · Preço sob consulta · compra ainda não disponível${s==="D"?" · resolução do original: "+((D.res||{})[o.id]||[]).join(" × ")+" px":""}
      ${escala.length?`<div class="escala" aria-label="Tamanhos relativos">${escala.map(([kk,[w,h]])=>`<div class="${kk===val("tam")?"on":""}" style="width:${w*2.2}px;height:${h*2.2}px">${TAM[kk]}</div>`).join("")}</div>`:""}`;
  };
  document.getElementById("f").addEventListener("change", e => { if(e.target.name==="sup") opcoes(); desenhar(); });
  opcoes(); desenhar();
  const fp = document.getElementById("form-ped"); let tipoPed = "produto";
  const resumo = () => { const s = val("sup"), sp = SUP.find(x=>x.k===s); const k = s==="ORIG" ? "ORIG" : s==="D" ? `D-${val("tam")}` : `${s}-${val("acab")}-${val("tam")}`; const p = PROD.find(x=>x.k===k);
    return `${o.id} · ${o.tit}\n${sp.nome}${p&&s!=="ORIG"?" · "+p.tipo.split(" — ")[1]+" · "+p.fmt:""}\nReferência: IL-${o.id}-${k}`; };
  document.querySelectorAll(".btn-ped[data-tipo]").forEach(b=>b.onclick=()=>{ tipoPed=b.dataset.tipo; document.getElementById("ped-tit").textContent = tipoPed==="produto"?"Pedido de produto":"Pedido de informação"; document.getElementById("ped-ref").textContent = resumo(); document.getElementById("ped-msg").textContent=""; fp.hidden=false; fp.querySelector("input").focus(); });
  document.getElementById("ped-x").onclick = () => fp.hidden = true;
  document.getElementById("f").addEventListener("change", () => { if(!fp.hidden) document.getElementById("ped-ref").textContent = resumo(); });
  fp.onsubmit = e => { e.preventDefault(); const d = new FormData(fp);
    const corpo = `${tipoPed==="produto"?"Pedido de produto":"Pedido de informação"}\n\n${resumo()}\nPágina: ${location.href}\n\nNome: ${d.get("nome")}\nEmail: ${d.get("email")}\nTelefone: ${d.get("tel")||"—"}\n\nMensagem:\n${d.get("msg")||"—"}`;
    const assunto = `${tipoPed==="produto"?"Pedido":"Informação"} — ${o.id} ${o.tit}`;
    location.href = `mailto:inlisboa@gmail.com?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    document.getElementById("ped-msg").textContent = "Abrimos o seu programa de email com o pedido preenchido. Se não abrir, escreva para inlisboa@gmail.com com a referência acima.";
  };
  ligarDownload(o);
  document.getElementById("ampliar").onclick = () => ampliar(o);
}
function ampliar(o){
  const base = document.querySelector("#ampliar img"), w = base.getBoundingClientRect().width * 4;
  const lupa = document.createElement("div"); lupa.className = "lupa";
  lupa.innerHTML = `<button type="button" class="fechar">Fechar ✕</button><img src="${web(o.id)}" alt="${o.tit}" style="width:${Math.round(w)}px">`;
  const fechar = () => { lupa.remove(); removeEventListener("keydown", tecla); };
  const tecla = e => { if (e.key === "Escape") fechar(); };
  lupa.addEventListener("click", fechar); addEventListener("keydown", tecla);
  document.body.appendChild(lupa);
  const im = lupa.querySelector("img");
  const centrar = () => { lupa.scrollLeft = (lupa.scrollWidth - lupa.clientWidth) / 2; lupa.scrollTop = (lupa.scrollHeight - lupa.clientHeight) / 2; };
  im.complete ? centrar() : im.addEventListener("load", centrar);
  lupa.querySelector(".fechar").focus();
}
let DL = null;
const usar = n => (window.claude && claude.use ? claude.use(n) : Promise.resolve(null)).catch(()=>null);
const dlPronto = Promise.all([usar("downloads"), usar("user")]).then(async ([d,u])=>{ const dono = u ? await u.isOwner().catch(()=>false) : false; DL = dono ? d : null; if(dono){ DONO = true; menu(); rota(); } });
function ligarDownload(o){
  const caixa = document.getElementById("baixar"), btn = document.getElementById("btn-orig"), msg = document.getElementById("baixar-msg");
  const nome = `IL-${o.id}-original.jpg`;
  dlPronto.then(()=>{
    if(!DL || !ORIG[nome] || !document.body.contains(caixa)) return;
    caixa.hidden = false;
    btn.onclick = async () => {
      btn.disabled = true; msg.textContent = "A preparar o ficheiro…";
      try{
        const r = await fetch(ORIG[nome]); if(!r.ok) throw {code:"fetch"};
        const blob = await r.blob();
        msg.textContent = `${(blob.size/1048576).toFixed(1)} MB · confirme a transferência`;
        await DL.save({filename: nome, data: blob});
        msg.textContent = "Ficheiro guardado: " + nome;
      }catch(e){
        const c = e && e.code;
        msg.textContent = c==="declined" ? "Transferência cancelada." : c==="rate_limited" ? "Já há uma transferência a aguardar confirmação." : c==="fetch" ? "Ficheiro original não encontrado." : "Não foi possível descarregar nesta vista.";
        if(c==="unavailable"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed") caixa.hidden = true;
      }finally{ btn.disabled = false; }
    };
  });
}
function rota(){
  const h = location.hash.slice(1) || "inicio";
  document.querySelectorAll("#nav a").forEach(a=>a.toggleAttribute("aria-current", h==="c-"+a.dataset.c || (h.startsWith("o-") && OBRAS.find(o=>"o-"+o.id===h)?.col===a.dataset.c)));
  if (h.startsWith("c-")) colecao(h.slice(2)); else if (h.startsWith("o-")) obra(h.slice(2)); else inicio();
  window.scrollTo(0,0);
}
addEventListener("hashchange", rota); rota();
</script>
